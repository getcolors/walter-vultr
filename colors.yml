# Desired state for one Walter development machine on Vultr.
#
# This is the only file you normally edit. Every value here is non-secret;
# credentials are COLORS_PAR_* variables in the ignored .envrc.private.

# Names the work directory, remote-state keys, generated machine keypair, and
# ~/.ssh/config alias. Never export COLORS_PAR_PROFILE.
profile: walter-vultr
workdir: .colors

provider-compute: vultr
provider-backend: r2

# Keep the deletion guard enabled. Lift it for one authorized delete with
# COLORS_PAR_COMPUTE_PREVENT_DESTROY=false; never edit this value for a delete.
compute-prevent-destroy: true

# Used by provider power operations. Walter waits for the requested state rather
# than returning while Vultr is still transitioning.
power-wait-seconds: 300

# Immutable provider id from the current instance. Keeping it in desired state
# lets stop/start work when the R2 backend is temporarily unavailable. Update it
# after every destroy/recreate.

# With no explicit provider machine key, Walter generates the dedicated
# ~/.ssh/walter-vultr keypair and a Terraform-managed Vultr key registration.
# The compute template uses that key directly. A successful delete removes the
# local key files after destroying the provider state; a later create generates
# a fresh pair. Vultr initially exposes root only for Walter's bootstrap; that
# stage creates ubuntu with passwordless sudo, then disables root and password
# SSH. Machine-level work and the primary managed alias use ubuntu.

# --- Vultr compute ----------------------------------------------------------
# Ubuntu 26.04 LTS in Amsterdam on a four-vCPU, eight-GB general-purpose instance.
vultr-name: walter-vultr
vultr-region: ams
vultr-plan: vc2-4c-8gb
vultr-os-id: 2760

# --- GitHub identity --------------------------------------------------------
# A real create starts GitHub's device flow before provisioning. The resulting
# machine-owned token is used for HTTPS clones; no GitHub SSH key or forwarded
# workstation agent reaches the server.
github-account: amiorin
git-email: 32617+amiorin@users.noreply.github.com

emacs-config-repo: https://github.com/amiorin/.emacs.d.git
emacs-config-dest: ~/.config/neoemacs

# --- Tooling ---------------------------------------------------------------
nix-packages:
  - asdf-vm
  - ripgrep
  - fd
  - fish
  - fzf
  - gh
  - caddy
  - awscli2
  - azure-cli
  - google-cloud-sdk
  - oci-cli
  - babashka
  - clojure
  - starship
  - zoxide
  - atuin
  - direnv
  - eza
  - zellij
  - gcc
  - devenv
  - age
  - claude-code
  - codex
  - pi-coding-agent

login-shell: fish

asdf-tools:
  - name: nodejs
    version: 24.20.0
    plugin: https://github.com/asdf-vm/asdf-nodejs.git
  - name: uv
    version: 0.12.7
    plugin: https://github.com/asdf-community/asdf-uv.git
  - name: bun
    version: 1.4.0
    plugin: https://github.com/cometkim/asdf-bun.git

corepack-packages:
  - pnpm

dotfiles-checkout: ~/code/getcolors/dotfiles

clone-orgs:
  - getcolors

atuin-username: amiorin

seed-agent-credentials:
  - claude
  - codex
  - pi

# Extra isolated logins beside ubuntu. Each receives the same environment in a
# private 0700 home and has no sudo. Connect with `ssh walter-vultr-rose` and
# `ssh walter-vultr-jack`; system-level work stays under `ssh walter-vultr`.
users:
  - rose
  - jack

# --- State backend ----------------------------------------------------------
# Shared R2 bucket; <profile>/<stage>.tfstate keeps this deployment isolated.
r2-bucket: tofu-state-319271fed8bc6d2d9059362be1165f37-eu
r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com

# Existing deployment ownership must be migrated before create.
compute-require-existing-state: true
